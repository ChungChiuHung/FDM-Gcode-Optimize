[project]
name = "fdm-optimize-agent"
version = "0.1.0"
description = "Agentic G-Code post-processing and optimization suite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=0.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

# --- 新增這一段 ---
# 讓 pytest 知道專案的根目錄在哪裡，這樣就能完美解析 "from src..."
[tool.pytest.ini_options]
pythonpath = [
    "."
]