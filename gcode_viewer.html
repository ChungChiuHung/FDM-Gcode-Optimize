<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometric AI - 3D G-Code Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        /* Styled Sliders */
        input[type="range"] {
            -webkit-appearance: none; width: 100%; background: transparent;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #3b82f6; cursor: pointer; margin-top: -6px; border: 2px solid #fff;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: #334155; border-radius: 2px;
        }
        input[type="range"]:disabled::-webkit-slider-thumb { background: #475569; border-color: #64748b;}
    </style>
</head>
<body class="flex h-screen w-screen select-none">

    <!-- Left Control Panel -->
    <div class="w-80 bg-slate-900 border-r border-slate-700 flex flex-col shadow-2xl z-10 shrink-0">
        <div class="p-6 border-b border-slate-800">
            <div class="flex items-center gap-3 mb-2">
                <i data-lucide="cuboid" class="text-blue-500 w-8 h-8"></i>
                <div>
                    <h1 class="text-xl font-bold text-white">Geometric AI</h1>
                    <p class="text-xs text-blue-400 font-mono tracking-wider">3D KINEMATIC VIEWER</p>
                </div>
            </div>
        </div>

        <div class="p-6 flex-1 overflow-y-auto space-y-6">
            <!-- File Upload -->
            <div>
                <label class="flex justify-center w-full h-24 px-4 transition bg-slate-800 border-2 border-slate-600 border-dashed rounded-xl appearance-none cursor-pointer hover:border-blue-500 focus:outline-none">
                    <span class="flex items-center space-x-2">
                        <i data-lucide="upload-cloud" class="w-6 h-6 text-slate-400"></i>
                        <span class="font-medium text-slate-400 text-sm" id="file-label">Load .gcode file</span>
                    </span>
                    <input type="file" id="file-input" class="hidden" accept=".gcode" />
                </label>
            </div>

            <div id="loading-indicator" class="hidden text-center py-4">
                <i data-lucide="loader-2" class="w-8 h-8 text-blue-500 animate-spin mx-auto mb-2"></i>
                <p class="text-sm text-slate-400" id="loading-text">Parsing Geometry & Kinematics...</p>
            </div>

            <!-- Dashboard -->
            <div id="stats-panel" class="hidden space-y-6">
                
                <!-- Z-Height / Layer Slider -->
                <div class="p-4 bg-slate-800 rounded-xl border border-slate-700 shadow-inner">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Vertical Slice (Z)</h3>
                        <span class="px-2 py-1 bg-slate-900 text-blue-400 text-xs rounded border border-slate-700 font-mono" id="current-layer-badge">L: 0</span>
                    </div>
                    <input type="range" id="layer-slider" min="0" max="0" value="0" class="w-full mb-2">
                    <div class="flex justify-between text-xs text-slate-400 font-mono mb-3">
                        <span id="stat-z-height">Z: 0.00 mm</span>
                        <span id="stat-layer-total">0 Layers</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button id="btn-layer-prev" title="Previous Layer" class="flex-1 flex items-center justify-center gap-1 bg-slate-700 hover:bg-slate-600 text-slate-300 hover:text-white py-1.5 rounded-lg transition text-xs font-semibold">
                            <i data-lucide="chevron-down" class="w-3 h-3"></i> Prev
                        </button>
                        <button id="btn-layer-next" title="Next Layer" class="flex-1 flex items-center justify-center gap-1 bg-slate-700 hover:bg-slate-600 text-slate-300 hover:text-white py-1.5 rounded-lg transition text-xs font-semibold">
                            Next <i data-lucide="chevron-up" class="w-3 h-3"></i>
                        </button>
                    </div>
                </div>

                <!-- Nozzle Kinematic Player -->
                <div class="p-4 bg-slate-800/80 border border-blue-900/50 rounded-xl shadow-inner relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-16 h-16 bg-blue-500/10 rounded-bl-full pointer-events-none"></div>
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                            <i data-lucide="crosshair" class="w-3 h-3 text-blue-400"></i> Nozzle Timeline
                        </h3>
                        <span id="stat-path-moves" class="text-slate-500 font-mono text-[10px]">0 / 0</span>
                    </div>

                    <input type="range" id="path-slider" min="0" max="0" value="0" class="w-full mb-3">

                    <!-- Playback Controls Row -->
                    <div class="flex items-center gap-2 mb-3">
                        <button id="btn-rewind" title="Rewind to Start" class="flex items-center justify-center bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-lg transition" style="width:2rem;height:2rem;min-width:2rem">
                            <i data-lucide="skip-back" class="w-3 h-3"></i>
                        </button>
                        <button id="btn-play" class="flex-1 flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded-lg transition font-semibold text-sm">
                            <i data-lucide="play" class="w-4 h-4"></i> Play
                        </button>
                        <button id="btn-fast-forward" title="Jump to End" class="flex items-center justify-center bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-lg transition" style="width:2rem;height:2rem;min-width:2rem">
                            <i data-lucide="skip-forward" class="w-3 h-3"></i>
                        </button>
                    </div>

                    <!-- Speed Control -->
                    <div>
                        <div class="flex justify-between text-xs text-slate-400 mb-1">
                            <span>Playback Speed</span>
                            <span id="speed-label" class="text-blue-400 font-mono font-bold">1&times;</span>
                        </div>
                        <input type="range" id="speed-slider" min="0" max="9" step="1" value="4" class="w-full">
                        <div class="flex justify-between text-slate-500 mt-1 font-mono" style="font-size:9px">
                            <span>1/16</span><span>⅛</span><span>¼</span><span>½</span><span>1×</span><span>2×</span><span>5×</span><span>10×</span><span>25×</span><span>50×</span>
                        </div>
                    </div>

                    <!-- Live Velocity & Camera Tracking -->
                    <div class="flex justify-between items-center mt-3 pt-3 border-t border-slate-700">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="toggle-follow" class="form-checkbox h-4 w-4 text-blue-500 rounded bg-slate-700 border-slate-600 focus:ring-blue-500 focus:ring-offset-slate-900">
                            <span class="text-xs text-slate-400 flex items-center gap-1">
                                <i data-lucide="navigation" class="w-3 h-3 text-blue-400"></i> Follow
                            </span>
                        </label>
                        <div class="flex items-center gap-1 text-xs text-slate-400" title="Live Kinematic Velocity">
                            <i data-lucide="gauge" class="w-3 h-3" id="icon-velocity"></i>
                            <span id="stat-velocity" class="text-slate-400 font-mono font-bold w-16 text-right">0 mm/s</span>
                        </div>
                    </div>
                </div>

                <!-- Visibility Toggles -->
                <div class="space-y-3 pt-2">
                    <label class="flex items-center space-x-3 cursor-pointer group">
                        <input type="checkbox" id="toggle-history" checked class="form-checkbox h-4 w-4 text-blue-500 rounded bg-slate-700 border-slate-600 focus:ring-blue-500 focus:ring-offset-slate-900">
                        <span class="text-sm text-slate-300 group-hover:text-white transition flex items-center gap-2">
                            <div class="w-3 h-3 rounded-sm bg-blue-900/80 border border-blue-700"></div> Show Printed Object
                        </span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer group">
                        <input type="checkbox" id="toggle-travel" checked class="form-checkbox h-4 w-4 text-blue-500 rounded bg-slate-700 border-slate-600 focus:ring-blue-500 focus:ring-offset-slate-900">
                        <span class="text-sm text-slate-300 group-hover:text-white transition flex items-center gap-2">
                            <div class="w-3 h-3 rounded-sm bg-red-500/50 border border-red-500"></div> Show Travel Moves
                        </span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- 3D Canvas Area -->
    <div class="flex-1 relative" id="canvas-container">
        <!-- Center Target UI -->
        <button id="btn-center" class="absolute bottom-6 right-6 bg-slate-800/80 hover:bg-slate-700 text-slate-300 p-3 rounded-xl border border-slate-600 shadow-lg backdrop-blur transition group hidden">
            <i data-lucide="focus" class="w-5 h-5 group-hover:text-blue-400 transition"></i>
        </button>
        
        <!-- Velocity Legend -->
        <div id="velocity-legend" class="absolute top-6 right-6 bg-slate-800/80 p-3 rounded-xl border border-slate-600 shadow-lg backdrop-blur hidden pointer-events-none">
            <div class="text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-wider text-center">Speed</div>
            <div class="flex h-32 gap-2">
                <div class="w-3 rounded bg-gradient-to-t from-blue-500 via-green-500 to-red-500"></div>
                <div class="flex flex-col justify-between text-[10px] text-slate-300 font-mono">
                    <span id="legend-max">0</span>
                    <span id="legend-min">0</span>
                </div>
            </div>
        </div>

        <div id="three-canvas" class="w-full h-full"></div>
    </div>

    <script>
        lucide.createIcons();

        // ==========================================
        // STATE
        // ==========================================
        let parsedData = { layers: [], bounds: null };
        let currentLayerIndex = 0;
        let currentPathIndex  = 0;
        let isPlaying         = false;
        let playAnimationId   = null;

        const SPEED_STEPS  = [0.0625, 0.125, 0.25, 0.5, 1, 2, 5, 10, 25, 50];
        const SPEED_LABELS = ['1/16\u00d7', '\u215b\u00d7', '\u00bc\u00d7', '\u00bd\u00d7', '1\u00d7', '2\u00d7', '5\u00d7', '10\u00d7', '25\u00d7', '50\u00d7'];
        let playSpeed = 1;
        let playAccum = 0;

        // ==========================================
        // THREE.JS GLOBALS
        // ==========================================
        let scene, camera, renderer, controls, nozzleMesh;
        const objectGroup = new THREE.Group();

        // Mesh cache — history is rebuilt only on layer change, not on every path step
        let historyMesh          = null;
        let historyBuiltForLayer = -1;
        let curExtrudeMesh       = null;
        let curTravelMesh        = null;

        // DrawRange lookup tables: curExtrudeVertexAtMove[i+1] = cumulative vertex count
        // after processing move[i], so setDrawRange(0, table[idx+1]) shows moves 0..idx.
        let curExtrudeVertexAtMove = null;
        let curTravelVertexAtMove  = null;

        // UI refs
        const fileInput     = document.getElementById('file-input');
        const layerSlider   = document.getElementById('layer-slider');
        const pathSlider    = document.getElementById('path-slider');
        const btnPlay       = document.getElementById('btn-play');
        const toggleHistory = document.getElementById('toggle-history');
        const toggleTravel  = document.getElementById('toggle-travel');
        const velocityLabel = document.getElementById('stat-velocity');

        // ==========================================
        // 1. THREE.JS SETUP
        // ==========================================
        function initThreeJS() {
            const container = document.getElementById('three-canvas');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020617);
            THREE.Object3D.DefaultUp.set(0, 0, 1); // Z-up for 3D printing

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 2000);
            camera.position.set(0, -300, 200);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 + 0.1;

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dir = new THREE.DirectionalLight(0xffffff, 0.8);
            dir.position.set(100, 100, 300);
            scene.add(dir);

            const bedGrid = new THREE.GridHelper(300, 30, 0x475569, 0x1e293b);
            bedGrid.rotation.x = Math.PI / 2;
            scene.add(bedGrid);
            scene.add(new THREE.AxesHelper(50));

            // Upside-down cone nozzle: tip at local origin (0,0,0), base floats above
            const coneH = 14;
            const nozzleGeo = new THREE.ConeGeometry(5, coneH, 16);
            nozzleGeo.translate(0, -coneH / 2, 0); // shift so apex = origin
            nozzleMesh = new THREE.Mesh(nozzleGeo, new THREE.MeshStandardMaterial({
                color: 0xff6000, emissive: 0xff2200, emissiveIntensity: 0.45,
                metalness: 0.2, roughness: 0.5, transparent: true, opacity: 0.92
            }));
            nozzleMesh.rotation.x = -Math.PI / 2; // tip points -Z (toward bed)
            nozzleMesh.visible = false;
            // Glowing tip sphere at apex
            nozzleMesh.add(new THREE.Mesh(
                new THREE.SphereGeometry(2, 10, 10),
                new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xff8800, emissiveIntensity: 1.2 })
            ));
            scene.add(nozzleMesh);
            scene.add(objectGroup);

            window.addEventListener('resize', () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });

            // Render loop
            (function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
        }

        // ==========================================
        // 2. G-CODE PARSER
        // ==========================================
        function parseGCode(text) {
            const layers = [];
            let currentLayerMoves = [];
            let x = 0, y = 0, z = 0, e = 0, f = 0;
            let isAbs = true, isAbsE = true;
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            let minV = Infinity, maxV = -Infinity;

            const lines = text.split('\n');
            let currentLayerZ = -1;

            for (let i = 0; i < lines.length; i++) {
                const cleanLine = lines[i].split(';')[0].trim().toUpperCase();
                if (!cleanLine) continue;

                if (cleanLine === 'G90') { isAbs  = true;  continue; }
                if (cleanLine === 'G91') { isAbs  = false; continue; }
                if (cleanLine === 'M82') { isAbsE = true;  continue; }
                if (cleanLine === 'M83') { isAbsE = false; continue; }

                if (cleanLine.startsWith('G92')) {
                    const m = cleanLine.match(/E([-+]?\d*\.?\d+)/);
                    if (m) e = parseFloat(m[1]);
                    continue;
                }

                // Only process G0/G1/G2/G3
                if (!cleanLine.startsWith('G0') && !cleanLine.startsWith('G1') &&
                    !cleanLine.startsWith('G2') && !cleanLine.startsWith('G3')) continue;

                // Parse parameters with a single regex pass (faster than split)
                const params = {};
                const re = /([A-Z])([-+]?\d*\.?\d+)/g;
                let pm;
                while ((pm = re.exec(cleanLine)) !== null) params[pm[1]] = parseFloat(pm[2]);

                if (params.F !== undefined) f = params.F;

                const nx = params.X !== undefined ? (isAbs  ? params.X : x + params.X) : x;
                const ny = params.Y !== undefined ? (isAbs  ? params.Y : y + params.Y) : y;
                const nz = params.Z !== undefined ? (isAbs  ? params.Z : z + params.Z) : z;

                let actual_e = 0;
                if (params.E !== undefined) {
                    actual_e = isAbsE ? (params.E - e) : params.E;
                    e = isAbsE ? params.E : e + params.E;
                }

                const isExtrude = actual_e > 0.0001;

                // Layer detection: a new extrusion Z that differs meaningfully = new layer
                if (isExtrude && nz > 0 && Math.abs(nz - currentLayerZ) > 0.001) {
                    if (currentLayerZ < 0) {
                        currentLayerZ = nz;
                    } else if (Math.abs(nz - currentLayerZ) > 0.05) {
                        if (currentLayerMoves.length > 0) {
                            layers.push({ z: currentLayerZ, moves: currentLayerMoves });
                            currentLayerMoves = [];
                        }
                        currentLayerZ = nz;
                    }
                }

                const dist = Math.hypot(nx - x, ny - y);
                if (dist > 0.001 || Math.abs(nz - z) > 0.001) {
                    currentLayerMoves.push({
                        type: isExtrude ? 'extrude' : 'travel',
                        x1: x, y1: y, z1: z, x2: nx, y2: ny, z2: nz, velocity: f
                    });
                    if (isExtrude) {
                        if (nx < minX) minX = nx; if (x < minX) minX = x;
                        if (nx > maxX) maxX = nx; if (x > maxX) maxX = x;
                        if (ny < minY) minY = ny; if (y < minY) minY = y;
                        if (ny > maxY) maxY = ny; if (y > maxY) maxY = y;
                        if (f > 0) { if (f < minV) minV = f; if (f > maxV) maxV = f; }
                    }
                }
                x = nx; y = ny; z = nz;
            }

            if (currentLayerMoves.length > 0 && currentLayerZ >= 0)
                layers.push({ z: currentLayerZ, moves: currentLayerMoves });

            if (minV === Infinity)  minV = 0;
            if (maxV === -Infinity) maxV = 1;

            return { layers, bounds: { minX, maxX, minY, maxY, minV, maxV } };
        }

        // ==========================================
        // 3. COLOR UTILITY — no THREE.Color allocation, inline HSL→RGB
        // ==========================================
        // Maps velocity to [r,g,b] floats: slow=blue, fast=red
        function velocityToRGB(v, minV, maxV) {
            if (maxV === minV) return [0.231, 0.510, 0.965];
            const t  = Math.max(0, Math.min(1, (v - minV) / (maxV - minV)));
            const h6 = (1.0 - t) * 0.66 * 6; // hue in [0, 3.96]
            const x  = 1 - Math.abs(h6 % 2 - 1);
            if (h6 < 1) return [1, x, 0];
            if (h6 < 2) return [x, 1, 0];
            if (h6 < 3) return [0, 1, x];
            return [0, x, 1]; // blue end
        }

        // ==========================================
        // 4. GEOMETRY MANAGEMENT
        // ==========================================
        function disposeMesh(mesh) {
            if (!mesh) return;
            if (mesh.geometry) mesh.geometry.dispose();
            if (mesh.material)  mesh.material.dispose();
        }

        // Called on layer change: (re)build history mesh and pre-allocate
        // the full current-layer geometry. Path progress uses drawRange — O(1).
        function rebuildForLayer() {
            // --- History (cached; only rebuild when layer index changes) ---
            if (historyBuiltForLayer !== currentLayerIndex) {
                if (historyMesh) { objectGroup.remove(historyMesh); disposeMesh(historyMesh); historyMesh = null; }

                if (toggleHistory.checked && currentLayerIndex > 0) {
                    let total = 0;
                    for (let i = 0; i < currentLayerIndex; i++)
                        for (const m of parsedData.layers[i].moves)
                            if (m.type === 'extrude') total++;

                    const pos = new Float32Array(total * 6);
                    const col = new Float32Array(total * 6);
                    const { minV, maxV } = parsedData.bounds;
                    let idx = 0;
                    for (let i = 0; i < currentLayerIndex; i++) {
                        for (const m of parsedData.layers[i].moves) {
                            if (m.type !== 'extrude') continue;
                            pos.set([m.x1, m.y1, m.z1, m.x2, m.y2, m.z2], idx * 6);
                            const [r, g, b] = velocityToRGB(m.velocity, minV, maxV);
                            col.set([r, g, b, r, g, b], idx * 6);
                            idx++;
                        }
                    }
                    const geo = new THREE.BufferGeometry();
                    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                    geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
                    historyMesh = new THREE.LineSegments(geo,
                        new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.15 }));
                    objectGroup.add(historyMesh);
                }
                historyBuiltForLayer = currentLayerIndex;
            }

            // --- Current layer: allocate full typed arrays, build drawRange tables ---
            if (curExtrudeMesh) { objectGroup.remove(curExtrudeMesh); disposeMesh(curExtrudeMesh); curExtrudeMesh = null; }
            if (curTravelMesh)  { objectGroup.remove(curTravelMesh);  disposeMesh(curTravelMesh);  curTravelMesh  = null; }

            const moves = parsedData.layers[currentLayerIndex].moves;
            const { minV, maxV } = parsedData.bounds;

            let nE = 0, nT = 0;
            for (const m of moves) { if (m.type === 'extrude') nE++; else nT++; }

            const ePos = new Float32Array(nE * 6);
            const eCol = new Float32Array(nE * 6);
            const tPos = new Float32Array(nT * 6);

            // +1 so index 0 = "0 vertices shown" (before any move)
            curExtrudeVertexAtMove = new Int32Array(moves.length + 1);
            curTravelVertexAtMove  = new Int32Array(moves.length + 1);

            let ei = 0, ti = 0;
            for (let i = 0; i < moves.length; i++) {
                const m = moves[i];
                if (m.type === 'extrude') {
                    ePos.set([m.x1, m.y1, m.z1, m.x2, m.y2, m.z2], ei * 6);
                    const [r, g, b] = velocityToRGB(m.velocity, minV, maxV);
                    eCol.set([r, g, b, r, g, b], ei * 6);
                    ei++;
                } else {
                    tPos.set([m.x1, m.y1, m.z1, m.x2, m.y2, m.z2], ti * 6);
                    ti++;
                }
                curExtrudeVertexAtMove[i + 1] = ei * 2; // 2 vertices per segment
                curTravelVertexAtMove [i + 1] = ti * 2;
            }

            if (nE > 0) {
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(ePos, 3));
                geo.setAttribute('color',    new THREE.BufferAttribute(eCol, 3));
                curExtrudeMesh = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ vertexColors: true }));
                objectGroup.add(curExtrudeMesh);
            }
            if (nT > 0) {
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(tPos, 3));
                curTravelMesh = new THREE.LineSegments(geo,
                    new THREE.LineBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.6 }));
                curTravelMesh.visible = toggleTravel.checked;
                objectGroup.add(curTravelMesh);
            }
        }

        // O(1): only updates drawRange + nozzle position + UI labels — no geometry rebuild
        function updatePathView() {
            if (!curExtrudeVertexAtMove) return;
            const moves = parsedData.layers[currentLayerIndex].moves;
            const idx   = Math.min(currentPathIndex, moves.length - 1);

            if (curExtrudeMesh) curExtrudeMesh.geometry.setDrawRange(0, curExtrudeVertexAtMove[idx + 1]);
            if (curTravelMesh)  {
                curTravelMesh.geometry.setDrawRange(0, curTravelVertexAtMove[idx + 1]);
                curTravelMesh.visible = toggleTravel.checked;
            }

            // Nozzle: world position = gcode coords + objectGroup offset
            const m = moves[idx];
            nozzleMesh.position.set(
                m.x2 + objectGroup.position.x,
                m.y2 + objectGroup.position.y,
                m.z2
            );
            nozzleMesh.visible = true;

            // Live readouts
            velocityLabel.textContent = `${Math.round(m.velocity / 60)} mm/s`;
            document.getElementById('stat-path-moves').textContent = `${idx} / ${moves.length - 1}`;
        }

        // ==========================================
        // 5. FILE LOAD & DATA INIT
        // ==========================================
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('file-label').textContent = file.name;
            document.getElementById('loading-indicator').classList.remove('hidden');
            document.getElementById('stats-panel').classList.add('hidden');
            document.getElementById('btn-center').classList.add('hidden');
            document.getElementById('velocity-legend').classList.add('hidden');

            const reader = new FileReader();
            reader.onload = function(evt) {
                setTimeout(() => {
                    parsedData = parseGCode(evt.target.result);
                    document.getElementById('loading-indicator').classList.add('hidden');
                    if (parsedData.layers.length > 0) {
                        initDataViewer();
                    } else {
                        alert('No printable layers found in this file.');
                    }
                }, 50);
            };
            reader.readAsText(file);
        });

        function initDataViewer() {
            document.getElementById('stats-panel').classList.remove('hidden');
            document.getElementById('btn-center').classList.remove('hidden');
            document.getElementById('velocity-legend').classList.remove('hidden');
            document.getElementById('stat-layer-total').textContent = `${parsedData.layers.length} Layers`;
            document.getElementById('legend-max').textContent = `${Math.round(parsedData.bounds.maxV / 60)} mm/s`;
            document.getElementById('legend-min').textContent = `${Math.round(parsedData.bounds.minV / 60)} mm/s`;

            layerSlider.max   = parsedData.layers.length - 1;
            layerSlider.value = 0;

            const { minX, maxX, minY, maxY } = parsedData.bounds;
            objectGroup.position.set(-(maxX + minX) / 2, -(maxY + minY) / 2, 0);

            historyBuiltForLayer = -1; // invalidate cache for new file
            nozzleMesh.visible   = false;

            centerCamera();
            setLayer(0);
        }

        function centerCamera() {
            controls.target.set(0, 0, 0);
            camera.position.set(0, -150, 150);
            controls.update();
        }

        function setLayer(index) {
            stopAnimation();
            currentLayerIndex = parseInt(index);
            const layer = parsedData.layers[currentLayerIndex];

            document.getElementById('current-layer-badge').textContent = `L: ${currentLayerIndex + 1}`;
            document.getElementById('stat-z-height').textContent = `Z: ${layer.z.toFixed(2)} mm`;

            pathSlider.max   = layer.moves.length - 1;
            pathSlider.value = layer.moves.length - 1;
            currentPathIndex = layer.moves.length - 1;

            rebuildForLayer();
            updatePathView();
        }

        function setPathProgress(index) {
            currentPathIndex = parseInt(index);
            pathSlider.value = currentPathIndex;
            updatePathView();
        }

        // ==========================================
        // 6. EVENT LISTENERS
        // ==========================================
        layerSlider.addEventListener('input', (e) => setLayer(e.target.value));
        pathSlider.addEventListener('input',  (e) => { stopAnimation(); setPathProgress(e.target.value); });

        // History toggle: invalidate cache so rebuildForLayer recreates it
        toggleHistory.addEventListener('change', () => { historyBuiltForLayer = -1; rebuildForLayer(); updatePathView(); });
        // Travel toggle: just flip visibility — no geometry rebuild needed
        toggleTravel.addEventListener('change', () => { if (curTravelMesh) curTravelMesh.visible = toggleTravel.checked; });

        document.getElementById('btn-center').addEventListener('click', centerCamera);

        document.getElementById('btn-layer-prev').addEventListener('click', () => {
            if (currentLayerIndex > 0) {
                layerSlider.value = currentLayerIndex - 1;
                setLayer(currentLayerIndex - 1);
            }
        });
        document.getElementById('btn-layer-next').addEventListener('click', () => {
            if (currentLayerIndex < parsedData.layers.length - 1) {
                layerSlider.value = currentLayerIndex + 1;
                setLayer(currentLayerIndex + 1);
            }
        });

        // ==========================================
        // 7. PLAYBACK ENGINE
        // ==========================================
        function togglePlay() {
            if (isPlaying) {
                stopAnimation();
            } else {
                isPlaying = true;
                btnPlay.innerHTML = `<i data-lucide="pause" class="w-4 h-4"></i> Pause`;
                lucide.createIcons();
                playAccum = 0;
                const max = parsedData.layers[currentLayerIndex].moves.length - 1;
                if (currentPathIndex >= max) { currentPathIndex = 0; pathSlider.value = 0; }
                playLoop();
            }
        }

        function stopAnimation() {
            isPlaying = false;
            btnPlay.innerHTML = `<i data-lucide="play" class="w-4 h-4"></i> Play`;
            lucide.createIcons();
            cancelAnimationFrame(playAnimationId);
        }

        function playLoop() {
            if (!isPlaying) return;
            const max = parsedData.layers[currentLayerIndex].moves.length - 1;

            playAccum += playSpeed;
            const steps = Math.floor(playAccum);
            playAccum -= steps;

            if (steps > 0) {
                currentPathIndex = Math.min(currentPathIndex + steps, max);
                setPathProgress(currentPathIndex);
                if (currentPathIndex >= max) { stopAnimation(); return; }

                if (document.getElementById('toggle-follow').checked) {
                    const m = parsedData.layers[currentLayerIndex].moves[currentPathIndex];
                    controls.target.lerp(
                        new THREE.Vector3(m.x2 + objectGroup.position.x, m.y2 + objectGroup.position.y, m.z2),
                        0.12
                    );
                }
            }
            playAnimationId = requestAnimationFrame(playLoop);
        }

        btnPlay.addEventListener('click', togglePlay);
        document.getElementById('btn-rewind').addEventListener('click', () => { stopAnimation(); setPathProgress(0); });
        document.getElementById('btn-fast-forward').addEventListener('click', () => {
            stopAnimation();
            setPathProgress(parsedData.layers[currentLayerIndex].moves.length - 1);
        });
        document.getElementById('speed-slider').addEventListener('input', (e) => {
            const i = parseInt(e.target.value);
            playSpeed = SPEED_STEPS[i];
            playAccum = 0;
            document.getElementById('speed-label').textContent = SPEED_LABELS[i];
        });

        // Boot!
        initThreeJS();
    </script>
</body>
</html>
